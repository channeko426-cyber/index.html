name: Update Marine Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Pythonファイルを使わず、ここで直接正しいURLからデータを取得して「data.json」を作ります
    - name: Fetch and Generate data.json
      run: |
        curl -s "https://open-meteo.com" > marine.json
        curl -s "https://open-meteo.com" > weather.json
        
        # 2つのデータを合体させて正しい形式のdata.jsonを出力するJavaScriptを実行
        node -e '
          const fs = require("fs");
          const m = JSON.parse(fs.readFileSync("marine.json"));
          const w = JSON.parse(fs.readFileSync("weather.json"));
          const times = m.hourly.time;
          const hourly_data = times.map((t, i) => ({
            time: t,
            wave_height: m.hourly.wave_height[i],
            wave_period: m.hourly.wave_period[i],
            wave_direction: m.hourly.wave_direction[i],
            wind_speed: w.hourly.wind_speed_10m[i],
            wind_direction: w.hourly.wind_direction_10m[i],
            weather_code: w.hourly.weather_code[i],
            temperature: w.hourly.temperature_2m[i]
          }));
          const jstNow = new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().replace("T", " ").substring(0, 16).replace(/-/g, "/");
          fs.writeFileSync("data.json", JSON.stringify({ updated_at: jstNow, hourly_data }, null, 2));
        '

    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        git add data.json
        git diff-index --quiet HEAD || git commit -m "Auto-update marine data"
        git push
