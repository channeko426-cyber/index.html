name: Update Marine Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 【ここを変更】新しく作ったキャッシュに汚染されていないファイルを直接実行します
    - name: Run data fetch script
      run: python ./get_sea_weather.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        git add data.json
        git diff-index --quiet HEAD || git commit -m "Auto-update marine data"
        git push
