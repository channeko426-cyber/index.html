name: Auto Update Marine Data

on:
  schedule:
    # 毎時0分（日本時間の毎時9分頃）に自動実行
    - cron: '0 * * * *'
  workflow_dispatch: # 手動ボタンを有効化

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 設定ファイル内に糸魚川（能生沖）の正しいAPIのURLを完全ベタ書き。もうファイル読み込みバグは起きません。
    - name: Fetch Live Data
      run: |
        curl -s "https://open-meteo.com" > raw_marine.json
        curl -s "https://open-meteo.com" > raw_weather.json

    - name: Format to data.json
      run: |
        node -e '
          const fs = require("fs");
          try {
            const m = JSON.parse(fs.readFileSync("raw_marine.json"));
            const w = JSON.parse(fs.readFileSync("raw_weather.json"));
            const times = m.hourly.time;
            const hourly_data = times.map((t, i) => ({
              time: t,
              wave_height: m.hourly.wave_height[i],
              wave_period: m.hourly.wave_period[i],
              wave_direction: m.hourly.wave_direction[i],
              wind_speed: w.hourly.wind_speed_10m[i],
              wind_direction: w.hourly.wind_direction_10m[i],
              weather_code: w.hourly.weather_code[i],
              temperature: w.hourly.temperature_2m[i]
            }));
            const jstNow = new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().replace("T", " ").substring(0, 16).replace(/-/g, "/");
            fs.writeFileSync("data.json", JSON.stringify({ updated_at: jstNow, hourly_data }, null, 2));
            print("Successfully formatted data.json");
          } catch(e) {
            console.error("🚨 JSON Parse Error:", e.message);
            process.exit(1);
          }
        '

    - name: Save data.json to Github
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        git add data.json
        git diff-index --quiet HEAD || git commit -m "Refresh marine data [skip ci]"
        git push
